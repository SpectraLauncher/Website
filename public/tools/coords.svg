<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 320 230" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .swirlA { animation: driftA 7.5s linear infinite; }
        .swirlB { animation: driftB 9.5s linear infinite; }

        @keyframes driftA {
            from { transform: translateY(0); }
            to   { transform: translateY(-36px); }
        }

        @keyframes driftB {
            from { transform: translateY(-36px); }
            to   { transform: translateY(0); }
        }

        .tw { animation: twinkle 3.4s ease-in-out infinite; }
        .tw2 { animation-delay: -1.2s; animation-duration: 4.6s; }
        .tw3 { animation-delay: -2.4s; animation-duration: 5.2s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; }
            50%      { opacity: 0.95; }
        }

        .spark { opacity: 0; animation: sparkUp 5s linear infinite; }
        .s2 { animation-delay: -1.7s; animation-duration: 6.2s; }
        .s3 { animation-delay: -3.4s; animation-duration: 4.4s; }

        @keyframes sparkUp {
            0%   { transform: translateY(0); opacity: 0; }
            15%  { opacity: 0.9; }
            100% { transform: translateY(-46px); opacity: 0; }
        }

        .needle {
            transform-box: fill-box;
            transform-origin: center;
            animation: settle 9s ease-in-out infinite;
        }

        @keyframes settle {
            0%   { transform: rotate(48deg); }
            10%  { transform: rotate(6deg); }
            24%  { transform: rotate(84deg); }
            38%  { transform: rotate(26deg); }
            52%  { transform: rotate(66deg); }
            66%  { transform: rotate(40deg); }
            80%  { transform: rotate(54deg); }
            100% { transform: rotate(48deg); }
        }

        .vA { animation: showA 7s steps(1) infinite; }
        .vB { opacity: 0; animation: showB 7s steps(1) infinite; }

        @keyframes showA {
            0%, 45%   { opacity: 1; }
            50%, 95%  { opacity: 0; }
            100%      { opacity: 1; }
        }

        @keyframes showB {
            0%, 45%   { opacity: 0; }
            50%, 95%  { opacity: 1; }
            100%      { opacity: 0; }
        }

        .arrow { animation: flow 2.6s ease-in-out infinite; }

        @keyframes flow {
            0%, 100% { opacity: 0.35; transform: translateX(0); }
            50%      { opacity: 1; transform: translateX(5px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .swirlA, .swirlB, .tw, .spark, .needle, .vB, .arrow { animation: none; }
            .vA { animation: none; opacity: 1; }
        }
    </style>
