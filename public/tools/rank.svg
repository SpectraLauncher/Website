<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 320 200" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .tag {
            transform-box: fill-box;
            transform-origin: left center;
            animation: slide 9s ease-in-out infinite;
        }

        .t2 { animation-delay: 0.35s; }
        .t3 { animation-delay: 0.7s; }
        .t4 { animation-delay: 1.05s; }

        @keyframes slide {
            0%        { opacity: 0; transform: translateX(-14px); }
            8%, 82%   { opacity: 1; transform: translateX(0); }
            92%, 100% { opacity: 0; transform: translateX(-14px); }
        }

        .spark { animation: twinkle 2.4s step-end infinite; }
        .s2 { animation-delay: 0.8s; }
        .s3 { animation-delay: 1.6s; }

        @keyframes twinkle {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0.15; }
        }

        .cursor { animation: blink 1.06s step-end infinite; }

        @keyframes blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .tag, .spark, .cursor { animation: none; opacity: 1; }
        }
    </style>

    <g id="frame">
        <rect x="14" y="16" width="292" height="2" fill="#a9b1bd"/>
