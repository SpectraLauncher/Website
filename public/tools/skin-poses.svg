<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 236 412" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .limb {
            transform-box: fill-box;
            transform-origin: 50% 8%;
        }

        .armL { animation: poseArmL 6s ease-in-out infinite; }
        .armR { animation: poseArmR 6s ease-in-out infinite; }
        .legL { animation: poseLegL 6s ease-in-out infinite; }
        .legR { animation: poseLegR 6s ease-in-out infinite; }
        .body { transform-box: fill-box; transform-origin: 50% 100%; animation: poseLean 6s ease-in-out infinite; }

        /* trzy pozy: stoi, macha, w biegu */
        @keyframes poseArmL {
            0%, 22%   { transform: rotate(0deg); }
            33%, 55%  { transform: rotate(-155deg); }
            66%, 88%  { transform: rotate(38deg); }
            100%      { transform: rotate(0deg); }
        }

        @keyframes poseArmR {
            0%, 22%   { transform: rotate(0deg); }
            33%, 55%  { transform: rotate(8deg); }
            66%, 88%  { transform: rotate(-38deg); }
            100%      { transform: rotate(0deg); }
        }

        @keyframes poseLegL {
            0%, 55%   { transform: rotate(0deg); }
            66%, 88%  { transform: rotate(-30deg); }
            100%      { transform: rotate(0deg); }
        }

        @keyframes poseLegR {
            0%, 55%   { transform: rotate(0deg); }
            66%, 88%  { transform: rotate(30deg); }
            100%      { transform: rotate(0deg); }
        }

        @keyframes poseLean {
            0%, 55%   { transform: rotate(0deg); }
            66%, 88%  { transform: rotate(-5deg); }
            100%      { transform: rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .limb, .body { animation: none; }
        }
    </style>
    <ellipse cx="118" cy="388" rx="55" ry="9" fill="#0b1020" opacity="0.4"/>
    <g class="body">
        <g class="limb armL">
            <rect x="30" y="112" width="44" height="132" fill="#4f46e5"/>
            <rect x="30" y="112" width="11" height="132" fill="#818cf8"/>
            <rect x="30" y="211" width="44" height="33" fill="#c98e58"/>
        </g>
        <g class="limb armR">
            <rect x="162" y="112" width="44" height="132" fill="#3730a3"/>
            <rect x="162" y="211" width="44" height="33" fill="#a97141"/>
        </g>
        <g class="limb legL">
            <rect x="74" y="244" width="44" height="132" fill="#2b3a67"/>
            <rect x="74" y="354" width="44" height="22" fill="#1a1208"/>
        </g>
        <g class="limb legR">
            <rect x="118" y="244" width="44" height="132" fill="#1e2a4d"/>
            <rect x="118" y="354" width="44" height="22" fill="#1a1208"/>
        </g>
        <rect x="74" y="112" width="88" height="132" fill="#4f46e5"/>
        <rect x="74" y="112" width="88" height="11" fill="#818cf8"/>
        <rect x="74" y="112" width="11" height="132" fill="#818cf8" opacity="0.5"/>
        <rect x="151" y="112" width="11" height="132" fill="#3730a3"/>
        <rect x="74" y="24" width="88" height="88" fill="#c98e58"/>
        <rect x="74" y="24" width="88" height="22" fill="#3a2817"/>
        <rect x="74" y="46" width="11" height="22" fill="#3a2817"/>
        <rect x="151" y="46" width="11" height="22" fill="#3a2817"/>
        <rect x="74" y="24" width="88" height="11" fill="#5b4023"/>
        <rect x="85" y="68" width="11" height="11" fill="#f1f5f9"/>
        <rect x="96" y="68" width="11" height="11" fill="#4f46e5"/>
        <rect x="129" y="68" width="11" height="11" fill="#f1f5f9"/>
        <rect x="140" y="68" width="11" height="11" fill="#4f46e5"/>
        <rect x="96" y="90" width="44" height="11" fill="#a97141"/>
        <rect x="74" y="24" width="11" height="88" fill="#e0a873" opacity="0.25"/>
    </g>
</svg>
