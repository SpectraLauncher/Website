<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 320 240" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .plate {
            transform-box: fill-box;
            transform-origin: center;
            animation: bob 5s ease-in-out infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        .t1, .t2, .t3 { opacity: 0; }
        .t1 { animation: swap 10.5s ease-in-out 0s infinite; }
        .t2 { animation: swap 10.5s ease-in-out -3.5s infinite; }
        .t3 { animation: swap 10.5s ease-in-out -7s infinite; }

        @keyframes swap {
            0%   { opacity: 0; }
            4%   { opacity: 1; }
            29%  { opacity: 1; }
            33%  { opacity: 0; }
            100% { opacity: 0; }
        }

        .mote {
            transform-box: fill-box;
            transform-origin: center;
            animation: rise 4.5s ease-in-out infinite;
        }

        .m2 { animation-delay: -1.5s; }
        .m3 { animation-delay: -3s; }
        .m4 { animation-delay: -2.2s; }

        @keyframes rise {
            0%   { transform: translateY(0); opacity: 0; }
            25%  { opacity: 0.85; }
            100% { transform: translateY(-58px); opacity: 0; }
        }

        .beam { animation: beamPulse 5s ease-in-out infinite; }

        @keyframes beamPulse {
            0%, 100% { opacity: 0.16; }
            50%      { opacity: 0.34; }
        }

        @media (prefers-reduced-motion: reduce) {
            .plate, .mote, .beam, .t2, .t3 { animation: none; }
            .t1 { animation: none; opacity: 1; }
        }
    </style>
    <ellipse cx="160" cy="226" rx="40" ry="6" fill="#000000" opacity="0.32"/>
    <g id="block">
        <rect x="128" y="156" width="64" height="12" fill="#7cb85a"/>
        <rect x="128" y="168" width="64" height="8" fill="#6ba043"/>
        <rect x="128" y="176" width="64" height="44" fill="#6b4a2f"/>
        <rect x="136" y="182" width="10" height="6" fill="#563a25"/>
        <rect x="162" y="188" width="12" height="6" fill="#563a25"/>
        <rect x="144" y="200" width="8" height="6" fill="#563a25"/>
        <rect x="172" y="204" width="10" height="6" fill="#563a25"/>
        <rect x="152" y="210" width="14" height="6" fill="#563a25"/>
        <rect x="128" y="156" width="4" height="64" fill="#000000" opacity="0.18"/>
        <rect x="188" y="156" width="4" height="64" fill="#000000" opacity="0.28"/>
    </g>
    <g class="beam">
        <rect x="159" y="104" width="2" height="4" fill="#a7f3d0"/>
        <rect x="159" y="112" width="2" height="4" fill="#a7f3d0"/>
        <rect x="159" y="120" width="2" height="4" fill="#a7f3d0"/>
        <rect x="159" y="128" width="2" height="4" fill="#a7f3d0"/>
        <rect x="159" y="136" width="2" height="4" fill="#a7f3d0"/>
        <rect x="159" y="144" width="2" height="4" fill="#a7f3d0"/>
        <rect x="159" y="152" width="2" height="4" fill="#a7f3d0"/>
    </g>
    <rect class="mote" x="134" y="150" width="3" height="3" fill="#d9ffe9" opacity="0"/>
    <rect class="mote m2" x="180" y="158" width="3" height="3" fill="#d9ffe9" opacity="0"/>
    <rect class="mote m3" x="152" y="146" width="3" height="3" fill="#d9ffe9" opacity="0"/>
    <rect class="mote m4" x="190" y="150" width="3" height="3" fill="#d9ffe9" opacity="0"/>
    <g class="plate">
