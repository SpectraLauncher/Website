    <style>
        #main {
            animation: hueCycle 8s linear infinite;
        }

        #side, #side1 {
            animation: sway 3.4s ease-in-out infinite;
        }

        #side1 {
            animation-direction: reverse;
        }

        @keyframes hueCycle {
            from { filter: hue-rotate(0deg); }
            to   { filter: hue-rotate(360deg); }
        }

        @keyframes sway {
            0%, 100% { translate: -7px 0; }
            50%      { translate: 7px 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            #main, #side, #side1 { animation: none; }
        }
    </style>
