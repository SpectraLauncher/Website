<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 300 260" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .bubble { opacity: 0; animation: rise 2.4s linear infinite; }
        .b2 { animation-delay: -0.8s; }
        .b3 { animation-delay: -1.6s; }

        @keyframes rise {
            0%   { transform: translateY(0); opacity: 0; }
            20%  { opacity: 0.9; }
            80%  { opacity: 0.9; }
            100% { transform: translateY(-52px); opacity: 0; }
        }

        .ember { animation: flicker 2.6s ease-in-out infinite; }

        @keyframes flicker {
            0%, 100% { opacity: 0.5; }
            40%      { opacity: 1; }
            60%      { opacity: 0.65; }
            80%      { opacity: 0.95; }
        }

        .i0, .i1, .i2 {
            transform-box: fill-box;
            transform-origin: center;
        }

        .k0 { opacity: 0; animation: fill0 10.5s steps(1) infinite; }

        @keyframes fill0 {
            0%, 0.0%   { opacity: 0; }
            8.0%, 33.2% { opacity: 1; }
            33.3%, 100%  { opacity: 0; }
        }

        .i0 { opacity: 0; animation: drop0 10.5s ease-in infinite; }

        @keyframes drop0 {
            0%, 0.0%  { transform: translateY(-26px); opacity: 0; }
            0.5%       { transform: translateY(-26px); opacity: 1; }
            6.0%       { transform: translateY(0); opacity: 1; }
            9.0%       { transform: translateY(0); opacity: 0; }
            100%        { transform: translateY(0); opacity: 0; }
        }
        .k1 { opacity: 0; animation: fill1 10.5s steps(1) infinite; }

        @keyframes fill1 {
            0%, 33.2%   { opacity: 0; }
            41.3%, 66.5% { opacity: 1; }
            66.6%, 100%  { opacity: 0; }
        }

        .i1 { opacity: 0; animation: drop1 10.5s ease-in infinite; }

        @keyframes drop1 {
            0%, 33.2%  { transform: translateY(-26px); opacity: 0; }
            33.8%       { transform: translateY(-26px); opacity: 1; }
            39.3%       { transform: translateY(0); opacity: 1; }
            42.3%       { transform: translateY(0); opacity: 0; }
            100%        { transform: translateY(0); opacity: 0; }
        }
        .k2 { opacity: 0; animation: fill2 10.5s steps(1) infinite; }

        @keyframes fill2 {
            0%, 66.6%   { opacity: 0; }
            74.7%, 99.9% { opacity: 1; }
            100.0%, 100%  { opacity: 0; }
        }

        .i2 { opacity: 0; animation: drop2 10.5s ease-in infinite; }

        @keyframes drop2 {
            0%, 66.6%  { transform: translateY(-26px); opacity: 0; }
            67.2%       { transform: translateY(-26px); opacity: 1; }
            72.7%       { transform: translateY(0); opacity: 1; }
            75.7%       { transform: translateY(0); opacity: 0; }
            100%        { transform: translateY(0); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bubble, .ember, .k1, .k2, .i0, .i1, .i2 { animation: none; }
            .k0 { animation: none; opacity: 1; }
        }
    </style>
