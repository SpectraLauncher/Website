<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 220 448" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .turn, .cape, .bob {
            transform-box: fill-box;
            transform-origin: center;
        }

        .bob { animation: bob 5s ease-in-out infinite; }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-5px); }
        }

        .turn { animation: flip 9s ease-in-out infinite; }

        @keyframes flip {
            0%, 42%   { transform: scaleX(1); }
            47%       { transform: scaleX(0.08); }
            52%, 92%  { transform: scaleX(1); }
            97%       { transform: scaleX(0.08); }
            100%      { transform: scaleX(1); }
        }

        .front { animation: showFront 9s steps(1) infinite; }
        .back  { opacity: 0; animation: showBack 9s steps(1) infinite; }

        @keyframes showFront {
            0%, 46%  { opacity: 1; }
            47%, 96% { opacity: 0; }
            97%      { opacity: 1; }
        }

        @keyframes showBack {
            0%, 46%  { opacity: 0; }
            47%, 96% { opacity: 1; }
            97%      { opacity: 0; }
        }

        .cape {
            transform-origin: 50% 0%;
            animation: sway 4.2s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% { transform: skewX(-3deg); }
            50%      { transform: skewX(3deg); }
        }

        .caret { animation: blink 1.06s step-end infinite; }

        @keyframes blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bob, .turn, .cape, .caret, .back { animation: none; }
            .front { animation: none; opacity: 1; }
        }
    </style>
    <ellipse cx="110" cy="382" rx="55" ry="8" fill="#0b1020" opacity="0.4"/>
    <g class="bob">
        <g class="turn">
            <g class="front">
