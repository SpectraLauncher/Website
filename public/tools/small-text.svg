        #l2 { animation-delay: 0.09s; }
        #l3 { animation-delay: 0.18s; }
        #l4 { animation-delay: 0.27s; }
        #l5 { animation-delay: 0.36s; }
        #l6 { animation-delay: 0.45s; }
        #l7 { animation-delay: 0.54s; }

        @keyframes shrink {
            0%, 12%   { scale: 1; }
            32%, 62%  { scale: 0.55; }
            82%, 100% { scale: 1; }
        }

