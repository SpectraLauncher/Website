<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 330 230" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .cover, .rcover, .carriage {
            transform-box: fill-box;
            transform-origin: left center;
        }

        .cover { animation: reveal 7s step-end infinite; }
        .rcover { animation: revealRow 7s step-end infinite; }
        .carriage { animation: carriage 7s step-end infinite; }

        @keyframes reveal {
            0% { transform: translateX(0); }
            6.0% { transform: translateX(0.0px); }
            14.5% { transform: translateX(82.0px); }
            23.0% { transform: translateX(150.0px); }
            31.5% { transform: translateX(210.0px); }
            40.0% { transform: translateX(274.0px); }
            94%, 100% { transform: translateX(0); }
        }

        @keyframes revealRow {
            0% { transform: translateX(0); }
            6.0% { transform: translateX(0.0px); }
            14.5% { transform: translateX(65.0px); }
            23.0% { transform: translateX(116.0px); }
            31.5% { transform: translateX(159.0px); }
            40.0% { transform: translateX(206.0px); }
            94%, 100% { transform: translateX(0); }
        }

        @keyframes carriage {
            0% { transform: translateX(0); }
            6.0% { transform: translateX(0.0px); }
            14.5% { transform: translateX(82.0px); }
            23.0% { transform: translateX(150.0px); }
            31.5% { transform: translateX(210.0px); }
            40.0% { transform: translateX(274.0px); }
            94%, 100% { transform: translateX(0); }
        }

        .caret { animation: blink 1.06s step-end infinite; }

        @keyframes blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .pg {
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: ping 7s ease-out infinite;
        }

        .pg2 { animation-delay: 0.1s; }
        .pg3 { animation-delay: 0.2s; }
        .pg4 { animation-delay: 0.3s; }
        .pg5 { animation-delay: 0.4s; }

        @keyframes ping {
            0%, 40%   { opacity: 0.18; transform: scaleY(0.2); }
            48%       { opacity: 1; transform: scaleY(1); }
            92%       { opacity: 1; transform: scaleY(1); }
            96%, 100% { opacity: 0.18; transform: scaleY(0.2); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cover, .rcover, .carriage, .caret, .pg { animation: none; }
            .cover, .rcover { opacity: 0; }
        }
    </style>
    <defs>
        <clipPath id="edClip"><rect x="16" y="20" width="298" height="56" fill="#fff"/></clipPath>
        <clipPath id="rowClip"><rect x="16" y="114" width="298" height="94" fill="#fff"/></clipPath>
    </defs>
    <g id="editor">
