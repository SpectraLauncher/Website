    </g>
    <g class="st2">
        <rect x="92" y="53" width="58" height="14" fill="#3f3f3f"/>
        <rect x="90" y="51" width="58" height="14" fill="#ffffff"/>
        <rect x="156" y="53" width="40" height="14" fill="#3f3f3f"/>
        <rect x="154" y="51" width="40" height="14" fill="#ffffff"/>
        <rect x="202" y="53" width="30" height="14" fill="#3f3f3f"/>
