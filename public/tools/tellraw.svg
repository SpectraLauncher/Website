<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 320 200" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .st1, .st2, .st3 { opacity: 0; }
        .st1 { animation: titleIn 12s ease-in-out 0s infinite; }
        .st2 { animation: show 12s ease-in-out -4s infinite; }
        .st3 { animation: show 12s ease-in-out -8s infinite; }

        .st1 {
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes titleIn {
            0%   { opacity: 0; scale: 0.86; }
            4%   { opacity: 1; scale: 1; }
            28%  { opacity: 1; scale: 1; }
            32%  { opacity: 0; scale: 1.06; }
            100% { opacity: 0; scale: 0.86; }
        }

        @keyframes show {
            0%   { opacity: 0; }
            4%   { opacity: 1; }
            28%  { opacity: 1; }
            32%  { opacity: 0; }
            100% { opacity: 0; }
        }

        .caret { animation: blink 1.1s steps(1) infinite; }

        @keyframes blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .st1, .st2, .st3, .caret { animation: none; }
            .st1 { opacity: 1; }
        }
    </style>
    <g id="screen">
        <rect x="4" y="4" width="312" height="192" fill="#24365c"/>
        <rect x="4" y="4" width="312" height="40" fill="#39527e"/>
        <rect x="4" y="124" width="312" height="8" fill="#6ba043"/>
        <rect x="4" y="132" width="312" height="12" fill="#4f7a33"/>
        <rect x="4" y="144" width="312" height="52" fill="#6b4a2f"/>
        <rect x="20" y="116" width="24" height="8" fill="#6ba043"/>
        <rect x="72" y="116" width="24" height="8" fill="#6ba043"/>
        <rect x="124" y="116" width="24" height="8" fill="#6ba043"/>
        <rect x="176" y="116" width="24" height="8" fill="#6ba043"/>
        <rect x="228" y="116" width="24" height="8" fill="#6ba043"/>
        <rect x="280" y="116" width="24" height="8" fill="#6ba043"/>
    </g>
    <g id="frame">
        <rect x="0" y="0" width="320" height="4" fill="#8b8b8b"/>
        <rect x="0" y="0" width="4" height="200" fill="#8b8b8b"/>
        <rect x="0" y="196" width="320" height="4" fill="#2f2f2f"/>
        <rect x="316" y="0" width="4" height="200" fill="#2f2f2f"/>
    </g>
    <g id="crosshair" opacity="0.85">
