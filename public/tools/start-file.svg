<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 330 250" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .cover, .carriage {
            transform-box: fill-box;
            transform-origin: left center;
        }

        .cover { animation: reveal 8s step-end infinite; }
        .carriage { animation: reveal 8s step-end infinite; }

        @keyframes reveal {
            0% { transform: translateX(0); }
            5.0% { transform: translateX(0.0px); }
            11.7% { transform: translateX(42.0px); }
            18.3% { transform: translateX(80.0px); }
            25.0% { transform: translateX(104.0px); }
            31.7% { transform: translateX(140.0px); }
            38.3% { transform: translateX(206.0px); }
            45.0% { transform: translateX(250.0px); }
            92%, 100% { transform: translateX(0); }
        }

        .caret { animation: blink 1.06s step-end infinite; }

        @keyframes blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .v0 { animation: swap0 16s steps(1) infinite; }
        .v1 { opacity: 0; animation: swap1 16s steps(1) infinite; }

        @keyframes swap0 {
            0%, 49%  { opacity: 1; }
            50%, 99% { opacity: 0; }
            100%     { opacity: 1; }
        }

        @keyframes swap1 {
            0%, 49%  { opacity: 0; }
            50%, 99% { opacity: 1; }
            100%     { opacity: 0; }
        }

        .fill {
            transform-box: fill-box;
            transform-origin: left center;
            animation: grow 16s ease-out infinite;
        }

        @keyframes grow {
            0%, 3%   { transform: scaleX(0); }
            8%, 49%  { transform: scaleX(1); }
            50%, 53% { transform: scaleX(0); }
            58%, 99% { transform: scaleX(1); }
            100%     { transform: scaleX(0); }
        }

        .tabA { animation: swap0 16s steps(1) infinite; }
        .tabB { opacity: 0; animation: swap1 16s steps(1) infinite; }

        @media (prefers-reduced-motion: reduce) {
            .cover, .carriage, .caret, .v1, .fill, .tabB { animation: none; }
            .v0, .tabA { animation: none; opacity: 1; }
            .cover { opacity: 0; }
        }
    </style>
