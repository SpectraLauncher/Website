<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 340 250" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .px, .brush, .sel {
            transform-box: fill-box;
            transform-origin: center;
        }

        .px { opacity: 0; animation: paint 9s ease-out infinite; }

        @keyframes paint {
            0%   { opacity: 0; scale: 0.3; }
            2%   { opacity: 1; scale: 1.3; }
            4%   { opacity: 1; scale: 1; }
            88%  { opacity: 1; scale: 1; }
            92%  { opacity: 0; scale: 1; }
            100% { opacity: 0; scale: 0.3; }
        }

        .brush { animation: move 9s step-end infinite; }

        @keyframes move {
            6.0% { transform: translate(22.5px, 40.5px); }
            9.7% { transform: translate(41.5px, 40.5px); }
            13.4% { transform: translate(98.5px, 40.5px); }
            17.1% { transform: translate(117.5px, 40.5px); }
            20.9% { transform: translate(22.5px, 59.5px); }
            24.6% { transform: translate(98.5px, 59.5px); }
            28.3% { transform: translate(41.5px, 59.5px); }
            32.0% { transform: translate(117.5px, 59.5px); }
            35.7% { transform: translate(60.5px, 97.5px); }
            39.4% { transform: translate(79.5px, 97.5px); }
            43.1% { transform: translate(3.5px, 78.5px); }
            46.9% { transform: translate(136.5px, 78.5px); }
            50.6% { transform: translate(41.5px, 21.5px); }
            54.3% { transform: translate(98.5px, 21.5px); }
            100% { transform: translate(0, 0); }
        }

        .sel { animation: pick 9s step-end infinite; }

        @keyframes pick {
            6.0% { transform: translateX(0.0px); }
            9.7% { transform: translateX(0.0px); }
            13.4% { transform: translateX(0.0px); }
            17.1% { transform: translateX(0.0px); }
            20.9% { transform: translateX(30.0px); }
            24.6% { transform: translateX(30.0px); }
            28.3% { transform: translateX(60.0px); }
            32.0% { transform: translateX(60.0px); }
            35.7% { transform: translateX(90.0px); }
            39.4% { transform: translateX(90.0px); }
            43.1% { transform: translateX(0.0px); }
            46.9% { transform: translateX(0.0px); }
            50.6% { transform: translateX(0.0px); }
            54.3% { transform: translateX(0.0px); }
            100% { transform: translateX(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .brush, .sel { animation: none; }
            .px { animation: none; opacity: 1; }
        }
    </style>
