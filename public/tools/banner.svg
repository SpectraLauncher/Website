<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 220 300" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" shape-rendering="crispEdges">
    <style>
        .cloth, .hem {
            transform-box: fill-box;
            transform-origin: 50% 0%;
        }

        .cloth { animation: sway 6.4s ease-in-out infinite; }
        .hem   { animation: hemSway 6.4s ease-in-out -0.8s infinite; }

        @keyframes sway {
            0%, 100% { transform: skewX(-2deg) rotate(0.3deg); }
            50%      { transform: skewX(2deg) rotate(-0.3deg); }
        }

        @keyframes hemSway {
            0%, 100% { transform: skewX(1.4deg); }
            50%      { transform: skewX(-1.4deg); }
        }

        .p1, .p2, .p3 { opacity: 0; }
        .p1 { animation: cycle 15s ease-in-out -1s infinite; }
        .p2 { animation: cycle 15s ease-in-out -6s infinite; }
        .p3 { animation: cycle 15s ease-in-out -11s infinite; }

        @keyframes cycle {
            0%    { opacity: 0; }
            4%    { opacity: 1; }
            30%   { opacity: 1; }
            34%   { opacity: 0; }
            100%  { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cloth, .hem, .p2, .p3 { animation: none; }
            .p1 { animation: none; opacity: 1; }
        }
    </style>
    <ellipse cx="108" cy="290" rx="46" ry="6" fill="#100303" opacity="0.35"/>
    <g id="stand">
