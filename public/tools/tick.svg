    <style>
        .dial, .marker {
            transform-box: fill-box;
            transform-origin: center;
        }

        .dial { animation: turn 20s linear infinite; }

        @keyframes turn {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .marker { animation: step20 5s steps(20, end) infinite; }

        @keyframes step20 {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .pip { animation: dim 5s ease-in-out infinite; }

        @keyframes dim {
            0%, 100% { opacity: 0.28; }
            50%      { opacity: 0.42; }
        }

        @media (prefers-reduced-motion: reduce) {
            .dial, .marker, .pip { animation: none; }
        }
    </style>
